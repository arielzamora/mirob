[pytest]
# Carpeta donde pytest busca tests (como el proyecto de tests en una solución .NET).
testpaths = tests
# Agrega backend/ al sys.path para poder escribir `from app...` en los tests,
# sin importar desde qué carpeta se ejecute pytest.
pythonpath = .
# Avisos internos de Starlette/anyio que vienen del TestClient; no son fallos nuestros.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
